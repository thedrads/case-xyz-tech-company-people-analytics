name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat pandas

      - name: Validate notebook structure when available
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          notebook = Path("notebooks/case_xyz_tech_company_people_analytics.ipynb")
          if notebook.exists():
              with notebook.open(encoding="utf-8") as file:
                  nbformat.read(file, as_version=4)
              print(f"Notebook válido: {notebook}")
          else:
              print("Notebook ainda não adicionado; validação ignorada.")
          PY

      - name: Validate processed CSV
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          csv_file = Path("data/processed/resultados_case_xyz_tech_company.csv")
          if not csv_file.exists():
              raise FileNotFoundError(f"Arquivo ausente: {csv_file}")

          dataframe = pd.read_csv(csv_file, sep=";", decimal=",")
          if dataframe.shape[0] != 3:
              raise ValueError("O resumo deve conter exatamente três cargos.")
          if dataframe.isna().any().any():
              raise ValueError("O arquivo consolidado contém valores ausentes.")

          print("CSV validado com sucesso.")
          PY
